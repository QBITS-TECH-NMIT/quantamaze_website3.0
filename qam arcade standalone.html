<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Q-Bits Arcade — Quant-A-Maze 3.0</title>
<style id="qam-arcade-styles">
  #qam-arcade{position:relative;overflow:hidden;background:#0A0A0A;color:#F2F2F2;padding:64px 24px;font-family:ui-sans-serif,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;border-top:1px solid rgba(255,255,255,.06);border-bottom:1px solid rgba(255,255,255,.06)}
  @media(min-width:640px){#qam-arcade{padding:96px 24px}}
  .qam-inner{max-width:72rem;margin:0 auto}
  .qam-kicker{font-family:ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;font-size:.7rem;font-weight:700;letter-spacing:.22em;text-transform:uppercase;color:#F5590A;margin:0 0 14px}
  .qam-title{font-size:1.9rem;font-weight:700;letter-spacing:-.01em;margin:0 0 14px;background:linear-gradient(90deg,#fff,#c9c9c9 70%);-webkit-background-clip:text;background-clip:text;color:transparent}
  @media(min-width:640px){.qam-title{font-size:2.75rem}}
  .qam-sub{max-width:42rem;color:#a8a29e;font-size:.95rem;line-height:1.65;margin:0 0 40px}
  .qam-grid{display:grid;gap:16px;grid-template-columns:1fr}
  @media(min-width:640px){.qam-grid{grid-template-columns:repeat(2,1fr);gap:22px}}
  @media(min-width:1024px){.qam-grid{grid-template-columns:repeat(4,1fr)}}
  .qam-grid-single{grid-template-columns:repeat(auto-fit,minmax(240px,1fr))!important;max-width:920px}
  .qam-card{position:relative;text-align:left;cursor:pointer;background:transparent;border:1px solid rgba(255,255,255,.1);border-radius:.6rem;padding:22px;color:inherit;font:inherit;transition:transform .18s ease,border-color .18s ease,box-shadow .18s ease}
  .qam-card:hover{transform:translateY(-3px);border-color:rgba(245,89,10,.55);box-shadow:0 12px 32px rgba(245,89,10,.09)}
  .qam-card:focus-visible{outline:2px solid #F5590A;outline-offset:2px}
  .qam-corner{position:absolute;font-size:11px;color:rgba(255,255,255,.25);line-height:1}
  .qam-corner.tr{top:10px;right:12px}
  .qam-corner.br{bottom:10px;right:12px}
  .qam-icon{display:flex;align-items:center;justify-content:center;width:48px;height:48px;border-radius:.3rem;border:1px solid rgba(255,255,255,.1);background:#17171c;font-size:1.25rem;margin-bottom:18px;color:#F5590A}
  .qam-icon svg{width:22px;height:22px}
  .qam-card:hover .qam-icon{border-color:rgba(245,89,10,.4);background:#1c1710;box-shadow:0 0 18px rgba(245,89,10,.12)}
  .qam-tag{display:inline-block;font-family:ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;font-size:.62rem;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:#F5590A;border:1px solid rgba(245,89,10,.2);background:rgba(245,89,10,.1);border-radius:.25rem;padding:4px 8px;margin-bottom:14px}
  .qam-card h3{font-size:1.05rem;font-weight:600;color:#eeece6;margin:0 0 8px}
  .qam-card p{font-size:.85rem;line-height:1.55;color:#a8a29e;margin:0 0 14px}
  .qam-meta{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 16px}
  .qam-meta .qam-pill{font-size:.6rem;padding:3px 8px;display:inline-flex;align-items:center;gap:4px}
  .qam-meta .qam-pill svg{width:11px;height:11px;flex:none}
  .qam-play{display:inline-flex;align-items:center;gap:6px;font-family:ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;font-size:.68rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:#F5590A}
  .qam-play svg{width:12px;height:12px;transition:transform .18s ease}
  .qam-card:hover .qam-play svg{transform:translateX(3px)}

  /* modal */
  .qam-overlay{position:fixed;inset:0;z-index:9999;background:rgba(6,6,6,.82);backdrop-filter:blur(6px);display:none;align-items:center;justify-content:center;padding:16px}
  .qam-overlay.qam-open{display:flex}
  .qam-modal{position:relative;width:100%;max-width:620px;max-height:88vh;overflow-y:auto;background:#0D0D0D;border:1px solid rgba(255,255,255,.1);border-radius:.75rem;padding:26px 22px 28px;box-shadow:0 30px 80px rgba(0,0,0,.6);font-family:ui-sans-serif,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:#F2F2F2}
  @media(min-width:640px){.qam-modal{padding:34px 34px 36px}}
  .qam-modal-close{position:absolute;top:16px;right:16px;width:32px;height:32px;border-radius:.35rem;border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.03);color:#F2F2F2;font-size:18px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:border-color .15s ease,background .15s ease}
  .qam-modal-close:hover{border-color:rgba(245,89,10,.5);background:rgba(245,89,10,.08)}
  .qam-modal-tag{display:inline-block;font-family:ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;font-size:.62rem;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:#F5590A;border:1px solid rgba(245,89,10,.2);background:rgba(245,89,10,.1);border-radius:.25rem;padding:4px 8px;margin-bottom:12px}
  .qam-modal h3{font-size:1.35rem;font-weight:700;margin:0 0 4px;color:#fff}
  .qam-modal-desc{color:#a8a29e;font-size:.85rem;margin:0 0 20px;line-height:1.55}
  .qam-modal-body{margin-top:6px}

  /* shared game bits */
  .qam-row{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:14px}
  .qam-btn{font-family:ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;font-size:.72rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:#0A0A0A;background:#F5590A;border:none;border-radius:.35rem;padding:10px 16px;cursor:pointer;transition:filter .15s ease,transform .15s ease}
  .qam-btn:hover{filter:brightness(1.08)}
  .qam-btn:active{transform:translateY(1px)}
  .qam-btn.qam-btn-ghost{background:transparent;color:#F2F2F2;border:1px solid rgba(255,255,255,.15)}
  .qam-btn.qam-btn-ghost:hover{border-color:rgba(245,89,10,.5);color:#F5590A}
  .qam-btn:disabled{opacity:.4;cursor:not-allowed}
  .qam-pill{font-family:ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;font-size:.68rem;color:#a8a29e;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);border-radius:.3rem;padding:5px 10px}
  .qam-status{font-size:.85rem;min-height:1.3em;margin:10px 0 4px;color:#a8a29e}
  .qam-status.qam-good{color:#7fdc8f}
  .qam-status.qam-bad{color:#f28b6b}

  /* maze */
  .qam-maze-wrap{display:flex;flex-direction:column;align-items:center;gap:14px}
  .qam-maze-canvas{width:100%;max-width:320px;aspect-ratio:1/1;background:#111;border:1px solid rgba(255,255,255,.1);border-radius:.4rem;touch-action:none}
  .qam-dpad{display:grid;grid-template-columns:repeat(3,42px);grid-template-rows:repeat(3,42px);gap:6px}
  .qam-dpad button{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.12);color:#F2F2F2;border-radius:.3rem;font-size:.9rem;cursor:pointer}
  .qam-dpad button:hover{border-color:rgba(245,89,10,.5);color:#F5590A}
  .qam-dpad .qam-empty{background:transparent;border:none}

  /* quantum coin flip — superposition */
  .qam-coin-arena{position:relative;display:flex;align-items:center;justify-content:center;height:200px;margin:6px 0 18px;border-radius:.5rem;background:radial-gradient(circle at 50% 40%,#0f0f16,#000 78%);border:1px solid rgba(255,255,255,.08);perspective:900px;overflow:hidden;transition:transform .12s ease-out}
  .qam-coin-arena.qam-clink{animation:qam-clink-pulse .3s ease-out}
  @keyframes qam-clink-pulse{0%{transform:scale(1)}40%{transform:scale(.94)}100%{transform:scale(1)}}
  .qam-coin-trail{position:absolute;width:140px;height:64px;border-radius:50%;background:radial-gradient(closest-side,rgba(6,182,212,.35),rgba(123,47,247,.14) 55%,transparent 76%);filter:blur(7px);animation:qam-trail-pulse 2.6s ease-in-out infinite;pointer-events:none}
  @keyframes qam-trail-pulse{0%,100%{opacity:.5;transform:scale(.92)}50%{opacity:.95;transform:scale(1.1)}}
  .qam-neon-coin{position:relative;width:104px;height:104px;transform-style:preserve-3d;animation:qam-neon-idle 2.6s linear infinite}
  @keyframes qam-neon-idle{
    0%{transform:rotateY(0deg) translate(0,0)}
    10%{transform:rotateY(36deg) translate(-1px,.5px)}
    20%{transform:rotateY(72deg) translate(1px,-.5px)}
    30%{transform:rotateY(108deg) translate(-1px,.4px)}
    40%{transform:rotateY(144deg) translate(1px,-.4px)}
    50%{transform:rotateY(180deg) translate(-1px,.5px)}
    60%{transform:rotateY(216deg) translate(1px,-.5px)}
    70%{transform:rotateY(252deg) translate(-1px,.4px)}
    80%{transform:rotateY(288deg) translate(1px,-.4px)}
    90%{transform:rotateY(324deg) translate(-1px,.5px)}
    100%{transform:rotateY(360deg) translate(0,0)}
  }
  .qam-neon-coin .qam-coin-face{position:absolute;inset:0;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:1.4rem;font-family:ui-monospace,monospace;backface-visibility:hidden;color:#eafcff;
    background:radial-gradient(circle at 34% 28%,rgba(255,255,255,.5),rgba(6,182,212,.16) 40%,rgba(6,10,20,.92) 78%);
    box-shadow:0 0 18px 4px rgba(6,182,212,.65),0 0 42px 11px rgba(123,47,247,.35),inset 0 0 14px rgba(6,182,212,.5);
    border:1px solid rgba(155,240,255,.6);text-shadow:0 0 8px rgba(120,230,255,.9),0 0 18px rgba(123,47,247,.6)}
  .qam-neon-coin .qam-back{transform:rotateY(180deg)}
  .qam-neon-coin.qam-collapsed{animation:none!important}
  .qam-neon-coin.qam-collapsed .qam-coin-face{
    background:radial-gradient(circle at 32% 26%,rgba(255,255,255,.55),rgba(255,255,255,0) 38%),linear-gradient(155deg,#d6d6d6,#8c8c8c 45%,#4a4a4a 100%);
    box-shadow:inset 0 0 0 3px rgba(0,0,0,.3),inset 0 0 12px rgba(0,0,0,.4),0 4px 10px rgba(0,0,0,.5);
    border-color:rgba(255,255,255,.15);color:#2a2a2a;text-shadow:0 1px 0 rgba(255,255,255,.35),0 -1px 0 rgba(0,0,0,.5)}
  .qam-coin-status{text-align:center;font-size:.9rem;line-height:1.55}
  .qam-coin-explain{text-align:center;font-size:.8rem;color:#a8a29e;line-height:1.6;margin:2px 0 18px}
  .qam-warning{text-align:center;color:#f28b6b;font-size:.8rem;margin:8px 0 0;line-height:1.55}
  .qam-chest{display:flex;align-items:center;gap:10px;margin-top:16px;padding:10px 14px;border-radius:.4rem;border:1px solid rgba(255,196,64,.35);background:rgba(255,196,64,.07)}
  .qam-chest-icon{font-size:1.4rem;filter:saturate(1.2) drop-shadow(0 0 6px rgba(255,196,64,.5))}
  .qam-chest-text{font-size:.75rem;color:#e8c987;line-height:1.4}
  .qam-chest-text strong{color:#ffd76a}

  /* split the reality — fractured superposition */
  .qam-flash{position:absolute;inset:0;background:radial-gradient(circle,rgba(255,255,255,.92),rgba(123,47,247,.4) 40%,transparent 70%);animation:qam-flash-out .6s ease-out forwards;pointer-events:none}
  @keyframes qam-flash-out{0%{opacity:1;transform:scale(.3)}100%{opacity:0;transform:scale(2.4)}}
  .qam-reality-sphere{position:relative;width:150px;height:150px;transform-style:preserve-3d;animation:qam-reality-spin 6s linear infinite}
  @keyframes qam-reality-spin{from{transform:rotateY(0deg) rotateX(10deg)}to{transform:rotateY(360deg) rotateX(10deg)}}
  .qam-reality-core{position:absolute;inset:28px;border-radius:50%;
    background:radial-gradient(circle at 38% 32%,#fff,rgba(255,255,255,0) 30%),radial-gradient(circle at 60% 68%,#7b2ff7,rgba(123,47,247,0) 55%),radial-gradient(circle at 46% 50%,#ffe2b0,#F5590A 55%,#3d0d66 100%);
    box-shadow:0 0 60px 18px rgba(245,89,10,.5),0 0 110px 34px rgba(123,47,247,.35),inset 0 0 30px rgba(255,255,255,.3);
    animation:qam-reality-pulse 1.6s ease-in-out infinite}
  @keyframes qam-reality-pulse{0%,100%{filter:brightness(1)}50%{filter:brightness(1.5)}}
  .qam-reality-coin{position:absolute;top:50%;left:50%;width:32px;height:32px;margin:-16px 0 0 -16px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:ui-monospace,monospace;font-size:.66rem;font-weight:800;color:#eafcff;
    background:radial-gradient(circle at 34% 28%,rgba(255,255,255,.85),rgba(6,182,212,.22) 45%,rgba(6,10,20,.12) 80%);
    border:1px solid rgba(200,240,255,.55);box-shadow:0 0 10px 2px rgba(6,182,212,.55);opacity:.85}
  .qam-btn-split{position:relative;background:linear-gradient(90deg,#7b2ff7,#06b6d4);color:#fff;box-shadow:0 0 16px rgba(123,47,247,.5);animation:qam-split-pulse 1.8s ease-in-out infinite}
  @keyframes qam-split-pulse{0%,100%{box-shadow:0 0 10px rgba(123,47,247,.4)}50%{box-shadow:0 0 22px rgba(6,182,212,.6)}}

  /* defuse the quantum core */
  .qam-core-header{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:14px}
  .qam-core-lives{display:flex;gap:8px}
  .qam-life-orb{width:32px;height:32px;border-radius:50%;position:relative;background:radial-gradient(circle at 32% 28%,#fff1de,#F5590A 55%,#7b2ff7 100%);box-shadow:0 0 12px rgba(245,89,10,.5);transition:filter .3s ease}
  .qam-life-orb.qam-decohered{background:radial-gradient(circle at 32% 28%,#8a8a8a,#3d3d3d 55%,#1c1c1c 100%);box-shadow:0 0 8px rgba(255,70,70,.35);filter:saturate(.3)}
  .qam-life-glitch{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:ui-monospace,monospace;font-weight:800;font-size:.62rem;color:#ff6b6b}
  .qam-life-glitch span{position:absolute;animation:qam-glitch-flicker 1s steps(1) infinite}
  .qam-life-glitch span:nth-child(2){animation-delay:.5s}
  @keyframes qam-glitch-flicker{0%,45%{opacity:1}50%,95%{opacity:0}100%{opacity:1}}
  .qam-core-power{font-family:ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;font-size:.66rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#F5590A;background:rgba(245,89,10,.1);border:1px solid rgba(245,89,10,.3);border-radius:.3rem;padding:8px 12px;cursor:pointer;transition:opacity .15s ease,border-color .15s ease}
  .qam-core-power:hover{border-color:rgba(245,89,10,.6)}
  .qam-core-power:disabled{opacity:.35;cursor:not-allowed}
  .qam-core-question{font-size:1rem;font-weight:600;color:#eeece6;margin:0 0 6px;line-height:1.5}
  .qam-core-hint{font-size:.75rem;color:#7b2ff7;margin:0 0 14px}
  .qam-quiz-option{display:block;width:100%;text-align:left;padding:11px 14px;margin-bottom:8px;border-radius:.4rem;border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.03);color:#eeece6;font-size:.88rem;cursor:pointer;transition:border-color .15s ease,background .15s ease}
  .qam-quiz-option:hover:not(:disabled){border-color:rgba(245,89,10,.5)}
  .qam-quiz-option:disabled{cursor:default}
  .qam-quiz-option.qam-opt-eliminated{opacity:.25;text-decoration:line-through;pointer-events:none}
  .qam-quiz-option.qam-opt-correct{border-color:#7fdc8f;background:rgba(127,220,143,.14);color:#c8f2ce}
  .qam-quiz-option.qam-opt-wrong{border-color:#f28b6b;background:rgba(242,139,107,.14);color:#ffd2c2}
  .qam-core-endcard{text-align:center;padding:10px 0}
  .qam-core-endcard h4{font-size:1.15rem;margin:6px 0;color:#eeece6}

  /* quantum tic-tac-toe */
  .qam-ttt-intro{text-align:center;font-size:.78rem;color:#8f8a85;line-height:1.55;margin:0 0 12px}
  .qam-ttt-status{text-align:center;font-size:.85rem;color:#a8a29e;min-height:2.4em;line-height:1.5;margin:0 0 14px}
  .qam-ttt-board{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;max-width:280px;margin:0 auto}
  .qam-ttt-cell{position:relative;aspect-ratio:1/1;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.12);border-radius:.4rem;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:border-color .15s ease,background .15s ease;padding:0}
  .qam-ttt-cell:hover:not(:disabled){border-color:rgba(245,89,10,.5);background:rgba(245,89,10,.06)}
  .qam-ttt-cell:disabled{cursor:not-allowed}
  .qam-ttt-cell--selected{border-color:#F5590A;box-shadow:0 0 0 2px rgba(245,89,10,.35)}
  .qam-ttt-cell--dim{opacity:.3;pointer-events:none}
  .qam-ttt-cell--collapse-choice{border-color:#7b2ff7;cursor:pointer;animation:qam-collapse-pulse 1s ease-in-out infinite}
  @keyframes qam-collapse-pulse{0%,100%{box-shadow:0 0 0 0 rgba(123,47,247,.55)}50%{box-shadow:0 0 0 7px rgba(123,47,247,0)}}
  .qam-ttt-mark{font-size:1.8rem;font-weight:800;font-family:ui-monospace,monospace}
  .qam-ttt-cell--solid{background:rgba(255,255,255,.05)}
  .qam-ttt-cell--solid.qam-ttt-x .qam-ttt-mark{color:#F5590A;text-shadow:0 0 14px rgba(245,89,10,.6)}
  .qam-ttt-cell--solid.qam-ttt-o .qam-ttt-mark{color:#06b6d4;text-shadow:0 0 14px rgba(6,182,212,.6)}
  .qam-ttt-ghosts{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:2px;padding:3px}
  .qam-ttt-ghost{font-family:ui-monospace,monospace;font-size:.7rem;font-weight:700;padding:2px 4px;border-radius:.25rem;opacity:.8;border:1px solid currentColor}
  .qam-ttt-ghost sub{font-size:.55em}
  .qam-ttt-ghost-X{color:#ffb37a;background:rgba(245,89,10,.12);text-shadow:0 0 6px rgba(245,89,10,.6)}
  .qam-ttt-ghost-O{color:#8fe9ff;background:rgba(6,182,212,.12);text-shadow:0 0 6px rgba(6,182,212,.6)}
</style>
<style>
  /* Standalone page wrapper (not part of the original site) */
  html, body { margin:0; padding:0; background:#0A0A0A; }
</style>
</head>
<body>
<section id="qam-arcade" aria-label="Q-Bits Arcade — playable challenge">
  <div class="qam-inner">
    <p class="qam-kicker">Level up while you explore</p>
    <h2 class="qam-title">Q-Bits Arcade</h2>
    <p class="qam-sub">A quick, playable challenge inspired by our hackathon. No sign-up needed — just a few minutes of fun while you look around.</p>
    <div class="qam-grid qam-grid-single">

      <button type="button" class="qam-card" data-qam-game="maze">
        <span class="qam-corner tr" aria-hidden="true">+</span>
        <span class="qam-corner br" aria-hidden="true">+</span>
        <div class="qam-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m16.24 7.76-1.804 5.411a2 2 0 0 1-1.265 1.265L7.76 16.24l1.804-5.411a2 2 0 0 1 1.265-1.265z"/><circle cx="12" cy="12" r="10"/></svg></div>
        <span class="qam-tag">ARCADE // 01</span>
        <h3>Q-Maze Runner</h3>
        <p>Navigate a qubit through a shifting maze as fast as you can.</p>
        <span class="qam-meta">
          <span class="qam-pill"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M13 2 3 14h9l-1 8 10-12h-9l1-8Z"/></svg>Easy</span>
          <span class="qam-pill"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg>~1 min</span>
          <span class="qam-pill"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17 20h5v-1a4 4 0 0 0-3-3.87M9 20H4v-1a4 4 0 0 1 3-3.87m6-1a4 4 0 1 0-4-4 4 4 0 0 0 4 4Z"/><circle cx="9" cy="9" r="3"/></svg>Solo</span>
        </span>
        <span class="qam-play">Play now <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span>
      </button>

      <button type="button" class="qam-card" data-qam-game="coin">
        <span class="qam-corner tr" aria-hidden="true">+</span>
        <span class="qam-corner br" aria-hidden="true">+</span>

          <span class="qam-pill"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 7a4 4 0 1 1-8 0 4 4 0 0 1 8 0Z"/><path d="M4 21v-1a6 6 0 0 1 6-6h0M20 21v-1a4 4 0 0 0-3-3.87"/><circle cx="18" cy="8" r="2.5"/></svg>You vs CPU</span>

<div class="qam-overlay" id="qam-overlay" aria-hidden="true">
  <div class="qam-modal" role="dialog" aria-modal="true" aria-labelledby="qam-modal-title">
    <button type="button" class="qam-modal-close" id="qam-modal-close" aria-label="Close game">&times;</button>
    <span class="qam-modal-tag" id="qam-modal-tag">ARCADE // 01</span>
    <h3 id="qam-modal-title">Q-Maze Runner</h3>
    <p class="qam-modal-desc" id="qam-modal-desc"></p>
    <div class="qam-modal-body" id="qam-modal-body"></div>
  </div>

<script id="qam-arcade-script">
(function(){
  "use strict";

  var overlay = document.getElementById('qam-overlay');
  var modalTag = document.getElementById('qam-modal-tag');
  var modalTitle = document.getElementById('qam-modal-title');
  var modalDesc = document.getElementById('qam-modal-desc');
  var modalBody = document.getElementById('qam-modal-body');
  var closeBtn = document.getElementById('qam-modal-close');
  var activeCleanup = null;

  var GAME_META = {
    maze: { tag: 'ARCADE // 01', title: 'Q-Maze Runner', desc: 'Use the arrow keys, WASD, or the on-screen pad to guide the qubit from the top-left to the glowing exit. Difficulty: Easy · ~1 min · Solo run — no computer opponent, just the clock.' },
    coin: { tag: 'ARCADE // 02', title: 'The Quantum Coin Flip (Superposition)', desc: 'Predict the state of the coin — heads, tails, or something a classical coin was never meant to do. Difficulty: Easy · ~30 sec · Solo — you\u2019re calling the outcome, not the machine.' },
    core: { tag: 'ARCADE // 03', title: 'Defuse the Quantum Core', desc: 'Answer short quantum questions to stabilize the reactor before your qubits decohere. Difficulty: Medium · ~2 min · Three lives, one power-up, no second reactor.' },
    ttt: { tag: 'ARCADE // 04', title: "Schrödinger's Showdown: Quantum Tic-Tac-Toe", desc: 'Place a ghost piece in two squares at once. Close a loop with your opponent and trigger a Measurement Event. Difficulty: Hard · ~3 min · You play X against a randomized Computer opponent playing O.' }
  };

  function openGame(id){
    var meta = GAME_META[id];
    if(!meta) return;
    modalTag.textContent = meta.tag;
    modalTitle.textContent = meta.title;
    modalDesc.textContent = meta.desc;
    modalBody.innerHTML = '';
    if(typeof activeCleanup === 'function'){ try{ activeCleanup(); }catch(e){} }
    activeCleanup = null;

    if(id === 'maze') activeCleanup = renderMaze(modalBody);
    if(id === 'coin') activeCleanup = renderCoin(modalBody);
    if(id === 'core') activeCleanup = renderCore(modalBody);
    if(id === 'ttt') activeCleanup = renderQTTT(modalBody);

    overlay.classList.add('qam-open');
    overlay.setAttribute('aria-hidden', 'false');
    document.body.style.overflow = 'hidden';
  }

  function closeModal(){
    overlay.classList.remove('qam-open');
    overlay.setAttribute('aria-hidden', 'true');
    document.body.style.overflow = '';
    if(typeof activeCleanup === 'function'){ try{ activeCleanup(); }catch(e){} }
    activeCleanup = null;
    modalBody.innerHTML = '';
  }

  document.querySelectorAll('[data-qam-game]').forEach(function(btn){
    btn.addEventListener('click', function(){ openGame(btn.getAttribute('data-qam-game')); });
  });
  closeBtn.addEventListener('click', closeModal);
  overlay.addEventListener('click', function(e){ if(e.target === overlay) closeModal(); });
  document.addEventListener('keydown', function(e){ if(e.key === 'Escape' && overlay.classList.contains('qam-open')) closeModal(); });

  /* ---------------------------------------------------------------- */
  /* GAME 1: Q-MAZE RUNNER                                             */
  /* ---------------------------------------------------------------- */
  function renderMaze(container){
    var COLS = 9, ROWS = 9;
    container.innerHTML =
      '<div class="qam-maze-wrap">' +
        '<div class="qam-row" style="width:100%;max-width:320px;justify-content:space-between;">' +
          '<span class="qam-pill" id="qam-maze-timer">0.0s</span>' +
          '<button type="button" class="qam-btn qam-btn-ghost" id="qam-maze-reset">New Maze</button>' +
        '</div>' +
        '<canvas class="qam-maze-canvas" id="qam-maze-canvas" width="320" height="320"></canvas>' +
        '<div class="qam-dpad" aria-hidden="false">' +
          '<span class="qam-empty"></span><button type="button" data-dir="up" aria-label="Up">▲</button><span class="qam-empty"></span>' +
          '<button type="button" data-dir="left" aria-label="Left">◀</button><span class="qam-empty"></span><button type="button" data-dir="right" aria-label="Right">▶</button>' +
          '<span class="qam-empty"></span><button type="button" data-dir="down" aria-label="Down">▼</button><span class="qam-empty"></span>' +
        '</div>' +
        '<p class="qam-status" id="qam-maze-status">Reach the orange exit to win.</p>' +
      '</div>';

    var canvas = container.querySelector('#qam-maze-canvas');
    var ctx = canvas.getContext('2d');
    var timerEl = container.querySelector('#qam-maze-timer');
    var statusEl = container.querySelector('#qam-maze-status');
    var cellSize = canvas.width / COLS;
    var player, won, startTime, rafId, tickInterval;

    function makeMaze(){
      var grid = [];
      for(var y=0;y<ROWS;y++){
        var row = [];
        for(var x=0;x<COLS;x++){ row.push({x:x,y:y,walls:{N:true,S:true,E:true,W:true},visited:false}); }
        grid.push(row);
      }
      var stack = [];
      var current = grid[0][0];
      current.visited = true;
      var visitedCount = 1;
      var total = COLS*ROWS;
      function neighbors(cell){
        var list = [];
        var x=cell.x, y=cell.y;
        if(y>0 && !grid[y-1][x].visited) list.push({cell:grid[y-1][x], dir:'N', opp:'S'});
        if(y<ROWS-1 && !grid[y+1][x].visited) list.push({cell:grid[y+1][x], dir:'S', opp:'N'});
        if(x<COLS-1 && !grid[y][x+1].visited) list.push({cell:grid[y][x+1], dir:'E', opp:'W'});
        if(x>0 && !grid[y][x-1].visited) list.push({cell:grid[y][x-1], dir:'W', opp:'E'});
        return list;
      }
      while(visitedCount < total){
        var opts = neighbors(current);
        if(opts.length){
          var pick = opts[Math.floor(Math.random()*opts.length)];
          current.walls[pick.dir] = false;
          pick.cell.walls[pick.opp] = false;
          pick.cell.visited = true;
          visitedCount++;
          stack.push(current);
          current = pick.cell;
        } else if(stack.length){
          current = stack.pop();
        }
      }
      return grid;
    }

    var grid = makeMaze();

    function draw(){
      ctx.clearRect(0,0,canvas.width,canvas.height);
      ctx.fillStyle = '#111';
      ctx.fillRect(0,0,canvas.width,canvas.height);
      ctx.strokeStyle = '#3a3a3a';
      ctx.lineWidth = 2;
      ctx.beginPath();
      for(var y=0;y<ROWS;y++){
        for(var x=0;x<COLS;x++){
          var c = grid[y][x];
          var px = x*cellSize, py = y*cellSize;
          if(c.walls.N){ ctx.moveTo(px,py); ctx.lineTo(px+cellSize,py); }
          if(c.walls.W){ ctx.moveTo(px,py); ctx.lineTo(px,py+cellSize); }
          if(x===COLS-1 && c.walls.E){ ctx.moveTo(px+cellSize,py); ctx.lineTo(px+cellSize,py+cellSize); }
          if(y===ROWS-1 && c.walls.S){ ctx.moveTo(px,py+cellSize); ctx.lineTo(px+cellSize,py+cellSize); }
        }
      }
      ctx.stroke();
      // exit
      ctx.fillStyle = 'rgba(245,89,10,0.85)';
      ctx.fillRect((COLS-1)*cellSize+cellSize*0.25, (ROWS-1)*cellSize+cellSize*0.25, cellSize*0.5, cellSize*0.5);
      // player
      ctx.beginPath();
      ctx.fillStyle = '#ffd27a';
      ctx.shadowColor = '#F5590A';
      ctx.shadowBlur = 12;
      ctx.arc(player.x*cellSize+cellSize/2, player.y*cellSize+cellSize/2, cellSize*0.28, 0, Math.PI*2);
      ctx.fill();
      ctx.shadowBlur = 0;
    }

    function reset(){
      grid = makeMaze();
      player = {x:0,y:0};
      won = false;
      startTime = Date.now();
      statusEl.textContent = 'Reach the orange exit to win.';
      statusEl.className = 'qam-status';
      draw();
    }

    function move(dir){
      if(won) return;
      var c = grid[player.y][player.x];
      if(dir==='up' && !c.walls.N) player.y--;
      if(dir==='down' && !c.walls.S) player.y++;
      if(dir==='left' && !c.walls.W) player.x--;
      if(dir==='right' && !c.walls.E) player.x++;
      draw();
      if(player.x === COLS-1 && player.y === ROWS-1){
        won = true;
        var secs = ((Date.now()-startTime)/1000).toFixed(1);
        statusEl.textContent = 'Solved in ' + secs + 's! Nice work.';
        statusEl.className = 'qam-status qam-good';
      }
    }

    function keyHandler(e){
      var map = {ArrowUp:'up',ArrowDown:'down',ArrowLeft:'left',ArrowRight:'right',w:'up',s:'down',a:'left',d:'right',W:'up',S:'down',A:'left',D:'right'};
      if(map[e.key]){ e.preventDefault(); move(map[e.key]); }
    }
    document.addEventListener('keydown', keyHandler);

    container.querySelectorAll('.qam-dpad button').forEach(function(btn){
      btn.addEventListener('click', function(){ move(btn.getAttribute('data-dir')); });
    });
    container.querySelector('#qam-maze-reset').addEventListener('click', reset);

    tickInterval = setInterval(function(){
      if(!won) timerEl.textContent = ((Date.now()-startTime)/1000).toFixed(1) + 's';
    }, 100);

    reset();

    return function cleanup(){
      document.removeEventListener('keydown', keyHandler);
      clearInterval(tickInterval);
      if(rafId) cancelAnimationFrame(rafId);
    };
  }

  /* ---------------------------------------------------------------- */
  /* GAME 2: QUANTUM COIN FLIP (SUPERPOSITION)                          */
  /* ---------------------------------------------------------------- */
  function renderCoin(container){
    var flipTimeout;

    function showChoice(){
      clearTimeout(flipTimeout);
      container.innerHTML =
        '<div class="qam-coin-arena" id="qam-coin-arena">' +
          '<div class="qam-coin-trail" aria-hidden="true"></div>' +
          '<div class="qam-neon-coin" id="qam-neon-coin">' +
            '<div class="qam-coin-face qam-front">H</div>' +
            '<div class="qam-coin-face qam-back">T</div>' +
          '</div>' +
        '</div>' +
        '<p class="qam-coin-status" id="qam-coin-status">Predict the state of the coin.</p>' +
        '<div class="qam-row" style="justify-content:center;gap:10px;" id="qam-coin-choices">' +
          '<button type="button" class="qam-btn qam-btn-ghost" data-guess="heads">Heads</button>' +
          '<button type="button" class="qam-btn qam-btn-ghost" data-guess="tails">Tails</button>' +
          '<button type="button" class="qam-btn qam-btn-split" data-guess="split">Split the Reality</button>' +
        '</div>';
      container.querySelectorAll('[data-guess]').forEach(function(btn){
        btn.addEventListener('click', function(){ handleGuess(btn.getAttribute('data-guess')); });
      });
    }

    function handleGuess(guess){
      var status = container.querySelector('#qam-coin-status');
      var choices = container.querySelector('#qam-coin-choices');
      if(choices) choices.remove();

      if(guess === 'split'){
        status.textContent = 'Refusing to choose…';
        flipTimeout = setTimeout(revealSplit, 700);
        return;
      }

      var arena = container.querySelector('#qam-coin-arena');
      var coin = container.querySelector('#qam-neon-coin');
      var trail = container.querySelector('.qam-coin-trail');
      status.textContent = 'Collapsing the wavefunction…';

      flipTimeout = setTimeout(function(){
        var outcome = Math.random() < 0.5 ? 'heads' : 'tails';
        if(trail) trail.style.display = 'none';
        coin.classList.add('qam-collapsed');
        coin.style.transform = outcome === 'heads' ? 'rotateY(0deg)' : 'rotateY(180deg)';
        arena.classList.add('qam-clink');

        var correct = guess === outcome;
        var outcomeLabel = outcome === 'heads' ? 'Heads' : 'Tails';
        status.innerHTML = 'Result: <strong>' + outcomeLabel + '</strong>. You guessed ' + (correct ? 'Correctly.' : 'Incorrectly.');

        var warn = document.createElement('p');
        warn.className = 'qam-warning';
        warn.innerHTML = '⚠️ Warning: You just collapsed the universe into a single timeline. You are thinking like a 1980s microchip.';
        status.insertAdjacentElement('afterend', warn);

        var chest = document.createElement('div');
        chest.className = 'qam-chest';
        chest.innerHTML = '<span class="qam-chest-icon" aria-hidden="true">🔒🪙</span><span class="qam-chest-text"><strong>Quantum Rewards Locked.</strong> Play again to unlock.</span>';
        warn.insertAdjacentElement('afterend', chest);

        appendReplay();
      }, 900);
    }

    function revealSplit(){
      var arena = container.querySelector('#qam-coin-arena');
      var status = container.querySelector('#qam-coin-status');

      var COUNT = 10;
      var coinsHtml = '';
      for(var i=0;i<COUNT;i++){
        var angle = (360/COUNT)*i;
        coinsHtml += '<div class="qam-reality-coin" style="transform:rotateY(' + angle + 'deg) translateZ(58px)">' + (i % 2 === 0 ? 'H' : 'T') + '</div>';
      }
      arena.innerHTML =
        '<div class="qam-flash" aria-hidden="true"></div>' +
        '<div class="qam-reality-sphere" id="qam-reality-sphere">' +
          '<div class="qam-reality-core" aria-hidden="true"></div>' +
          coinsHtml +
        '</div>';

      status.innerHTML = '🌀 Reality Fractured! You didn\'t just guess the coin—you became the observer.';

      var welcome = document.createElement('p');
      welcome.className = 'qam-coin-explain';
      welcome.textContent = 'Welcome to the Quantum Realm. You just trapped a qubit in a state of infinite possibilities.';
      status.insertAdjacentElement('afterend', welcome);

      var followUp = document.createElement('p');
      followUp.className = 'qam-coin-explain';
      followUp.textContent = "In our world, a coin must be flat. In the quantum world, the coin is spinning in a sealed box. It is 100% Heads and 100% Tails at the exact same millisecond. By choosing \u2018Split,\u2019 you refused to force it to choose. You just mastered superposition.";
      welcome.insertAdjacentElement('afterend', followUp);

      appendReplay();
    }

    function appendReplay(){
      var row = document.createElement('div');
      row.className = 'qam-row';
      row.style.justifyContent = 'center';
      row.innerHTML = '<button type="button" class="qam-btn" id="qam-coin-replay">Flip again</button>';
      container.appendChild(row);
      container.querySelector('#qam-coin-replay').addEventListener('click', showChoice);
    }

    showChoice();
    return function cleanup(){ clearTimeout(flipTimeout); };
  }


  /* ---------------------------------------------------------------- */
  /* GAME 3: DEFUSE THE QUANTUM CORE                                    */
  /* ---------------------------------------------------------------- */
  function renderCore(container){
    var QUESTIONS = [
      { q: 'What can a qubit do that a classical bit cannot?', opts: ['Only ever be 0', 'Only ever be 1', 'Be 0 and 1 at the same time', 'Store letters instead of numbers'], correct: 2 },
      { q: 'What is it called when a measured qubit settles into one definite value?', opts: ['Superposition', 'Entanglement', 'Measurement collapse', 'Tunneling'], correct: 2 },
      { q: 'Two qubits linked so that measuring one instantly affects the other are:', opts: ['Superposed', 'Entangled', 'Isolated', 'Classical'], correct: 1 },
      { q: 'If two entangled qubits are correlated and one is measured as 0, the other is:', opts: ['Unrelated to it', 'Instantly correlated too', 'Erased', 'Always 1'], correct: 1, entangleWith: 2 },
      { q: 'Which symbol is commonly used for a qubit in the "0" state?', opts: ['|0⟩', '0!', 'Q-0', 'Ø'], correct: 0 },
      { q: 'What do we call unwanted noise that disturbs a qubit\'s fragile state?', opts: ['Amplification', 'Superposition', 'Decoherence', 'Interference only'], correct: 2 }
    ];

    var qIndex = 0, lives = [true, true, true], powerupUsed = false, finished = false;
    var correctMap = {}, eliminatedMap = {};

    function livesHtml(){
      return lives.map(function(alive){
        if(alive) return '<div class="qam-life-orb"></div>';
        return '<div class="qam-life-orb qam-decohered"><span class="qam-life-glitch"><span>0</span><span>1</span></span></div>';
      }).join('');
    }

    function showQuestion(){
      var q = QUESTIONS[qIndex];
      var hintNote = '';
      if(q.entangleWith !== undefined && correctMap[q.entangleWith] && !eliminatedMap[qIndex]){
        var wrongIdx = -1;
        for(var w=0; w<q.opts.length; w++){ if(w !== q.correct){ wrongIdx = w; break; } }
        eliminatedMap[qIndex] = [wrongIdx];
        hintNote = '<p class="qam-core-hint">🔗 Entangled bonus: your correct answer on the linked sector removed one wrong option.</p>';
      } else if(hintNote === '' && eliminatedMap[qIndex] && eliminatedMap[qIndex].length && q.entangleWith !== undefined){
        hintNote = '<p class="qam-core-hint">🔗 Entangled bonus already applied to this sector.</p>';
      }
      if(!eliminatedMap[qIndex]) eliminatedMap[qIndex] = [];

      container.innerHTML =
        '<div class="qam-core-header">' +
          '<div class="qam-core-lives">' + livesHtml() + '</div>' +
          '<span class="qam-pill">Sector ' + (qIndex+1) + ' / ' + QUESTIONS.length + '</span>' +
          '<button type="button" class="qam-core-power" id="qam-core-power"' + (powerupUsed ? ' disabled' : '') + '>⚡ Superposition (1 use)</button>' +
        '</div>' +
        hintNote +
        '<p class="qam-core-question">' + q.q + '</p>' +
        '<div id="qam-core-options"></div>' +
        '<p class="qam-status" id="qam-core-status"></p>';

      var optWrap = container.querySelector('#qam-core-options');
      q.opts.forEach(function(opt, i){
        var btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'qam-quiz-option';
        btn.textContent = opt;
        if(eliminatedMap[qIndex].indexOf(i) !== -1){
          btn.classList.add('qam-opt-eliminated');
          btn.disabled = true;
        }
        btn.addEventListener('click', function(){ answer(i); });
        optWrap.appendChild(btn);
      });

      var powerBtn = container.querySelector('#qam-core-power');
      powerBtn.addEventListener('click', function(){
        if(powerupUsed) return;
        powerupUsed = true;
        var wrongIndices = [];
        for(var i=0;i<q.opts.length;i++){ if(i !== q.correct && eliminatedMap[qIndex].indexOf(i) === -1) wrongIndices.push(i); }
        for(var r=wrongIndices.length-1;r>0;r--){ var s=Math.floor(Math.random()*(r+1)); var t=wrongIndices[r]; wrongIndices[r]=wrongIndices[s]; wrongIndices[s]=t; }
        var toRemove = wrongIndices.slice(0, Math.max(0, wrongIndices.length - 1));
        toRemove.forEach(function(i){ eliminatedMap[qIndex].push(i); });
        container.querySelector('#qam-core-status').textContent = '⚡ Superposition activated — down to a 50/50.';
        showQuestion();
      });
    }

    function answer(i){
      var q = QUESTIONS[qIndex];
      var optWrap = container.querySelector('#qam-core-options');
      var buttons = optWrap.querySelectorAll('.qam-quiz-option');
      buttons.forEach(function(b){ b.disabled = true; });
      var status = container.querySelector('#qam-core-status');
      var correct = i === q.correct;

      if(correct){
        buttons[i].classList.add('qam-opt-correct');
        correctMap[qIndex] = true;
        status.textContent = '✅ Correct!';
        status.className = 'qam-status qam-good';
      } else {
        buttons[i].classList.add('qam-opt-wrong');
        buttons[q.correct].classList.add('qam-opt-correct');
        var idx = lives.indexOf(true);
        if(idx !== -1) lives[idx] = false;
        status.textContent = '❌ Incorrect — a qubit decohered.';
        status.className = 'qam-status qam-bad';
      }

      setTimeout(function(){
        if(lives.indexOf(true) === -1){
          showEnd(false);
        } else if(qIndex === QUESTIONS.length - 1){
          showEnd(true);
        } else {
          qIndex++;
          showQuestion();
        }
      }, 1000);
    }

    function showEnd(won){
      finished = true;
      container.innerHTML =
        '<div class="qam-core-endcard">' +
          '<div class="qam-core-lives" style="justify-content:center;margin-bottom:12px;">' + livesHtml() + '</div>' +
          '<h4>' + (won ? 'Quantum Core Stabilized!' : 'Reactor Collapsed Into Decoherence') + '</h4>' +
          '<p class="qam-status ' + (won ? 'qam-good' : 'qam-bad') + '" style="text-align:center;">' +
            (won ? 'All sectors cleared with ' + lives.filter(Boolean).length + ' qubit(s) still stable.' : 'All three qubits decohered before the core could be stabilized.') +
          '</p>' +
          '<button type="button" class="qam-btn" id="qam-core-replay" style="margin-top:8px;">Restart mission</button>' +
        '</div>';
      container.querySelector('#qam-core-replay').addEventListener('click', function(){
        qIndex = 0; lives = [true,true,true]; powerupUsed = false; finished = false;
        correctMap = {}; eliminatedMap = {};
        showQuestion();
      });
    }

    showQuestion();
    return function cleanup(){};
  }

  /* ---------------------------------------------------------------- */
  /* GAME 4: SCHRÖDINGER'S SHOWDOWN — QUANTUM TIC-TAC-TOE                */
  /* ---------------------------------------------------------------- */
  function renderQTTT(container){
    var LINES = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
    var HUMAN = 'X', COMPUTER = 'O';
    var cells, moves, moveCounter, currentPlayer, selected, pendingMeasurement, gameOver, winner;
    var cpuTimer = null;

    function init(){
      cells = [];
      for(var i=0;i<9;i++) cells.push({ classical: null, marks: [] });
      moves = {};
      moveCounter = 0;
      currentPlayer = 'X';
      selected = null;
      pendingMeasurement = null;
      gameOver = false;
      winner = null;
      if(cpuTimer){ clearTimeout(cpuTimer); cpuTimer = null; }
      render();
    }

    function isComputerTurn(){
      return !gameOver && currentPlayer === COMPUTER;
    }

    function cpuPickMeasurement(pm){
      return Math.random() < 0.5 ? pm.a : pm.b;
    }

    function cpuPickMove(){
      var empties = [];
      for(var i=0;i<9;i++) if(!cells[i].classical) empties.push(i);
      // shuffle
      for(var j=empties.length-1;j>0;j--){
        var k = Math.floor(Math.random()*(j+1));
        var tmp = empties[j]; empties[j] = empties[k]; empties[k] = tmp;
      }
      return { a: empties[0], b: empties[1] };
    }

    function maybeScheduleComputer(){
      if(cpuTimer){ clearTimeout(cpuTimer); cpuTimer = null; }
      if(!isComputerTurn()) return;
      cpuTimer = setTimeout(function(){
        cpuTimer = null;
        if(gameOver || currentPlayer !== COMPUTER) return;
        if(pendingMeasurement){
          if(pendingMeasurement.player === COMPUTER) resolveMeasurement(cpuPickMeasurement(pendingMeasurement));
          return;
        }
        var mv = cpuPickMove();
        if(mv.a === undefined || mv.b === undefined) return;
        makeMove(mv.a, mv.b);
      }, 550);
    }

    function buildUF(){
      var parent = {};
      function find(x){
        if(parent[x] === undefined) parent[x] = x;
        if(parent[x] !== x) parent[x] = find(parent[x]);
        return parent[x];
      }
      function union(x,y){ var rx = find(x), ry = find(y); if(rx !== ry) parent[rx] = ry; }
      Object.keys(moves).forEach(function(id){
        var mv = moves[id];
        if(mv.resolved) return;
        union(mv.a, mv.b);
      });
      return find;
    }

    function makeMove(a,b){
      var find = buildUF();
      var willCycle = find(a) === find(b);
      moveCounter++;
      var id = moveCounter;
      moves[id] = { id: id, player: currentPlayer, a: a, b: b, resolved: false };
      cells[a].marks.push(id);
      cells[b].marks.push(id);
      selected = null;

      if(willCycle){
        pendingMeasurement = { moveId: id, a: a, b: b, player: currentPlayer };
        render();
      } else {
        finishMoveSequence();
      }
    }

    function resolveMeasurement(chosenCell){
      var pm = pendingMeasurement;
      if(!pm) return;
      var move = moves[pm.moveId];
      var queue = [];

      function resolveCellForMove(cell, mv){
        if(mv.resolved) return;
        mv.resolved = true;
        cells[cell].classical = mv.player;
        queue.push(cell);
      }

      resolveCellForMove(chosenCell, move);

      while(queue.length){
        var c = queue.shift();
        Object.keys(moves).forEach(function(id){
          var mv = moves[id];
          if(mv.resolved) return;
          if(mv.a === c || mv.b === c){
            var other = mv.a === c ? mv.b : mv.a;
            if(cells[other].classical){
              mv.resolved = true;
              return;
            }
            resolveCellForMove(other, mv);
          }
        });
      }

      cells.forEach(function(cell){
        cell.marks = cell.marks.filter(function(id){ return !moves[id].resolved; });
      });

      pendingMeasurement = null;
      finishMoveSequence();
    }

    function checkWin(){
      for(var i=0;i<LINES.length;i++){
        var l = LINES[i];
        var v = cells[l[0]].classical;
        if(v && cells[l[1]].classical === v && cells[l[2]].classical === v) return v;
      }
      return null;
    }

    function isDraw(){
      var empty = cells.filter(function(c){ return !c.classical; }).length;
      return empty < 2;
    }

    function finishMoveSequence(){
      var win = checkWin();
      if(win){ gameOver = true; winner = win; render(); return; }
      if(isDraw()){ gameOver = true; winner = 'draw'; render(); return; }
      currentPlayer = currentPlayer === 'X' ? 'O' : 'X';
      selected = null;
      render();
    }

    function handleCellClick(index){
      if(gameOver) return;
      if(isComputerTurn()) return;
      if(pendingMeasurement){
        if(pendingMeasurement.player !== HUMAN) return;
        if(index === pendingMeasurement.a || index === pendingMeasurement.b) resolveMeasurement(index);
        return;
      }
      if(cells[index].classical) return;
      if(selected === null){ selected = index; render(); return; }
      if(selected === index){ selected = null; render(); return; }
      var a = selected, b = index;
      makeMove(a,b);
    }

    function playerLabel(p){
      return p === HUMAN ? 'You (X)' : 'Computer (O)';
    }

    function statusText(){
      if(gameOver){
        if(winner === 'draw') return 'Stalemate — the wavefunction never resolved. It\u2019s a draw.';
        if(winner === HUMAN) return '\uD83C\uDFC6 You collapsed reality and win!';
        return '\uD83C\uDFC6 The Computer collapsed reality and wins!';
      }
      if(pendingMeasurement){
        if(pendingMeasurement.player === COMPUTER) return '\u26A1 Measurement Event! Computer is choosing which square becomes real\u2026';
        return '\u26A1 Measurement Event! Your call \u2014 choose which square becomes real.';
      }
      if(currentPlayer === COMPUTER) return '\uD83E\uDD16 Computer is thinking\u2026';
      if(selected !== null){
        return 'Your turn: pick a second square to complete your Quantum Move.';
      }
      return 'Your turn \u2014 select two empty squares for a Quantum Move.';
    }

    function cellHtml(i){
      var cell = cells[i];
      var classes = ['qam-ttt-cell'];
      if(cell.classical) classes.push('qam-ttt-cell--solid', cell.classical === 'X' ? 'qam-ttt-x' : 'qam-ttt-o');
      if(selected === i) classes.push('qam-ttt-cell--selected');
      if(pendingMeasurement){
        if(i === pendingMeasurement.a || i === pendingMeasurement.b) classes.push('qam-ttt-cell--collapse-choice');
        else classes.push('qam-ttt-cell--dim');
      }

      var inner = '';
      if(cell.classical){
        inner = '<span class="qam-ttt-mark">' + cell.classical + '</span>';
      } else if(cell.marks.length){
        inner = '<span class="qam-ttt-ghosts">' + cell.marks.map(function(id){
          var mv = moves[id];
          return '<span class="qam-ttt-ghost qam-ttt-ghost-' + mv.player + '">' + mv.player + '<sub>' + id + '</sub></span>';
        }).join('') + '</span>';
      }

      var cpuTurn = isComputerTurn();
      var disabled = (cell.classical && !pendingMeasurement) || (cpuTurn && !cell.classical && !pendingMeasurement) ? ' disabled' : '';
      if(pendingMeasurement && pendingMeasurement.player === COMPUTER) disabled = ' disabled';
      return '<button type="button" class="' + classes.join(' ') + '" data-cell="' + i + '"' + disabled + '>' + inner + '</button>';
    }

    function render(){
      var html = '<p class="qam-ttt-intro">You\u2019re X, the Computer is O. Select two empty squares to place a ghost piece there at once. When your ghost pieces close a loop, reality forces a Measurement Event.</p>';
      html += '<p class="qam-ttt-status" id="qam-ttt-status">' + statusText() + '</p>';
      html += '<div class="qam-ttt-board" id="qam-ttt-board">';
      for(var i=0;i<9;i++) html += cellHtml(i);
      html += '</div>';
      if(gameOver){
        html += '<div class="qam-row" style="justify-content:center;margin-top:16px;"><button type="button" class="qam-btn" id="qam-ttt-replay">Play again</button></div>';
      } else {
        html += '<div class="qam-row" style="justify-content:center;margin-top:16px;"><button type="button" class="qam-btn qam-btn-ghost" id="qam-ttt-reset">Restart</button></div>';
      }
      container.innerHTML = html;

      if(gameOver){
        container.querySelector('#qam-ttt-replay').addEventListener('click', init);
      } else {
        container.querySelector('#qam-ttt-reset').addEventListener('click', init);
        container.querySelectorAll('[data-cell]').forEach(function(btn){
          btn.addEventListener('click', function(){ handleCellClick(parseInt(btn.getAttribute('data-cell'), 10)); });
        });
      }
      maybeScheduleComputer();
    }

    init();
    return function cleanup(){ if(cpuTimer){ clearTimeout(cpuTimer); cpuTimer = null; } };
  }

})();
</script>

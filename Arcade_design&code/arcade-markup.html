<section id="qam-arcade" aria-label="Q-Bits Arcade — playable challenges">
  <div class="qam-inner">
    <p class="qam-kicker">Level up while you explore</p>
    <h2 class="qam-title">Q-Bits Arcade</h2>
    <p class="qam-sub">Four quick, playable challenges inspired by our hackathon tracks. No sign-up needed — just a few minutes of fun while you look around.</p>
    <div class="qam-grid">

      <button type="button" class="qam-card" data-qam-game="maze">
        <span class="qam-corner tr" aria-hidden="true">+</span>
        <span class="qam-corner br" aria-hidden="true">+</span>
        <div class="qam-icon" aria-hidden="true">🧭</div>
        <span class="qam-tag">ARCADE // 01</span>
        <h3>Q-Maze Runner</h3>
        <p>Navigate a qubit through a shifting maze as fast as you can.</p>
        <span class="qam-play">Play now <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span>
      </button>

      <button type="button" class="qam-card" data-qam-game="circuit">
        <span class="qam-corner tr" aria-hidden="true">+</span>
        <span class="qam-corner br" aria-hidden="true">+</span>
        <div class="qam-icon" aria-hidden="true">⚛️</div>
        <span class="qam-tag">ARCADE // 02</span>
        <h3>Circuit Builder</h3>
        <p>Place quantum gates in the right order to match the target circuit.</p>
        <span class="qam-play">Play now <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span>
      </button>

      <button type="button" class="qam-card" data-qam-game="cipher">
        <span class="qam-corner tr" aria-hidden="true">+</span>
        <span class="qam-corner br" aria-hidden="true">+</span>
        <div class="qam-icon" aria-hidden="true">🔐</div>
        <span class="qam-tag">ARCADE // 03</span>
        <h3>Crack the Cipher</h3>
        <p>Race the clock to break a Caesar cipher before quantum computing does it for you.</p>
        <span class="qam-play">Play now <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span>
      </button>

      <button type="button" class="qam-card" data-qam-game="chain">
        <span class="qam-corner tr" aria-hidden="true">+</span>
        <span class="qam-corner br" aria-hidden="true">+</span>
        <div class="qam-icon" aria-hidden="true">⛓️</div>
        <span class="qam-tag">ARCADE // 04</span>
        <h3>Chain the Blocks</h3>
        <p>Rebuild a shuffled blockchain by matching each block's hash to the one before it.</p>
        <span class="qam-play">Play now <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span>
      </button>

    </div>
  </div>
</section>

<div class="qam-overlay" id="qam-overlay" aria-hidden="true">
  <div class="qam-modal" role="dialog" aria-modal="true" aria-labelledby="qam-modal-title">
    <button type="button" class="qam-modal-close" id="qam-modal-close" aria-label="Close game">&times;</button>
    <span class="qam-modal-tag" id="qam-modal-tag">ARCADE // 01</span>
    <h3 id="qam-modal-title">Q-Maze Runner</h3>
    <p class="qam-modal-desc" id="qam-modal-desc"></p>
    <div class="qam-modal-body" id="qam-modal-body"></div>
  </div>
</div>
